# CI — what this repo did not have.
#
# Until now the only workflow here was release.yml, on tag push. So the
# WinFSP half of the driver — `mod winfsp_adapter` in mount.rs, 1034 of
# its 1786 lines, gated on `all(windows, feature = "mount")` — was only
# ever compiled when someone cut a release.
#
# That is how this repo drifted onto am-fs-core v0.1.0 while the family
# was on v0.2.4, and onto two floating `heads/main` refs, without
# anything reporting it. A dependency bump could not be validated
# without tagging a release, so it was not validated.
#
# This job is deliberately NOT release.yml with the uploads removed. It
# reuses the same Rust / LLVM-MinGW / libclang / WinFsp setup, because
# that is what makes the Windows half compile at all, and stops there:
# no WiX, no MSI, no installer, no silent-install verification. Those
# are release concerns and they are slow. What this answers is the one
# question a pull request needs answered — does the driver still build
# against its dependencies.
name: CI

on:
  push:
    branches: [main]
  # EVERY pull request, not only those targeting main. With
  # `branches: [main]` a PR stacked on another branch got no run at all,
  # and a PR with no checks has no failing checks.
  pull_request:
  # The merge queue's run: main plus the queued pull requests, the run that
  # decides whether they land. The queue reads ci-ok only from a workflow
  # that triggers here.
  merge_group:
  # The full Windows matrix also runs weekly against main, so a change in
  # the runner image, WinFsp or the pinned siblings shows up without a
  # pull request to provoke it, and on demand.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A newer push to a pull request cancels its older run: the matrix job holds
# a Windows runner for most of an hour, and a superseded run's answer is
# about a commit nobody will merge. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Does this change need the full pipeline? rust-fs-core's
  # scripts/code-changed.sh reads the change's paths and says false only when
  # every one is documentation. The change is the pull request's diff, the
  # merge queue group's (its base_sha to its head_sha: what the queue is about
  # to land), or a push to main's (before to after); a push it cannot diff
  # runs everything. The expensive jobs run
  # only when the answer is true, and ci-ok accepts their skip when, and only
  # when, it is false.
  changes:
    name: changes (does this need the full pipeline?)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rust-fs-core at the pinned tag, for code-changed.sh
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.8
          path: rust-fs-core
      - name: Classify the change
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$MQ_BASE...$MQ_HEAD" ;;
            push)
              case "$REF" in
                refs/heads/*)
                  if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
                    git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    range="$PUSH_BEFORE...$PUSH_AFTER"
                  fi ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            git diff --name-only "$range" | tee changed.txt
            code="$(bash rust-fs-core/scripts/code-changed.sh < changed.txt)"
          else
            code=true
          fi
          echo "code=$code ($EVENT${range:+ $range})"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The harness's runner accepts unknown scenario keys, so a matrix its
  # schema rejects still runs, and nothing here noticed when it did. This
  # holds fs-windows-test-harness.toml and test-matrix.json to the harness's
  # schemas at the pinned HARNESS_REF, through the harness's own validator.
  matrix-schema:
    name: matrix schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check out the harness sibling
        # Only the harness: the check needs its schemas and validator and
        # nothing else. The URL and ref are read out of chores.yml, as the
        # Windows job below does, so the pin stays declared in one place.
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }
          git init --quiet ../fs-windows-test-harness
          git -C ../fs-windows-test-harness remote add origin "$(pin HARNESS_URL)"
          git -C ../fs-windows-test-harness fetch --quiet --depth 1 origin "$(pin HARNESS_REF)"
          git -C ../fs-windows-test-harness checkout --quiet FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet 'jsonschema==4.23.0'

      - run: python3 scripts/check-matrix-schema.py

  # The portable half: everything outside `mod winfsp_adapter`. Cheap,
  # fast, and catches most dependency drift before the expensive job
  # even starts.
  portable:
    name: check (${{ matrix.os }}, no Windows features)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        # No submodules: there are none left. winfsp-rs is needed on
        # THIS runner too despite being Windows-only -- cargo resolves
        # every path dependency when it parses the manifest, including
        # cfg(windows) ones this target will never build.

      - name: check out sibling repos
        # The family repos are siblings, not submodules; the refs live
        # in chores.yml so this reads them from there rather than
        # restating them. chore itself is fetched at a pinned version —
        # an unpinned installer would make this workflow depend on
        # whatever chore shipped that morning, which is the opposite of
        # what pinning the siblings is for.
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.9.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.9.0-linux-arm64.tar.gz" ;;
            Darwin-arm64)   asset="chore-0.9.0-darwin-arm64.tar.gz" ;;
            Darwin-x86_64)  asset="chore-0.9.0-darwin-x86_64.tar.gz" ;;
            *) echo "no chore build for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.9.0/$asset" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The family's scripts run in place from rust-fs-core, and this
      # repository keeps no copy of them.
      - run: bash ../rust-fs-core/scripts/family-check.sh

      # EACH STEP IS A QUIET TIER: ../rust-fs-core/scripts/tier.sh writes the whole run to
      # tmp/logs/<tier>.log, prints one verdict line, and fails a passing
      # run that printed more than its measured budget (exit 65). The logs
      # are uploaded below, pass or fail.
      - run: bash ../rust-fs-core/scripts/tier.sh --refuse-skips check -- cargo check --locked --no-default-features
      - run: bash ../rust-fs-core/scripts/tier.sh --refuse-skips clippy -- cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: bash ../rust-fs-core/scripts/tier.sh --refuse-skips test -- cargo test --locked --no-default-features

      - name: upload tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-${{ matrix.os }}
          path: tmp/logs/
          if-no-files-found: warn

  # The half that only exists on Windows, and the reason this file is
  # worth its runtime.
  windows:
    name: check (windows, mount + service)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      LLVM_MINGW_VER: 20260421
    steps:
      - uses: actions/checkout@v4
        # No submodules; winfsp-rs is a sibling like everything
        # else, and the header patch below reaches into that checkout.

      - name: siblings + Windows toolchain (Rust gnullvm, LLVM-MinGW, libclang, WinFsp, fsctl.h patch)
        uses: ./.github/actions/windows-toolchain
        with:
          llvm-mingw-version: ${{ env.LLVM_MINGW_VER }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --features mount,service
        shell: bash
        run: bash ../rust-fs-core/scripts/tier.sh --refuse-skips check-windows -- cargo check --locked --features mount,service --target x86_64-pc-windows-gnullvm

      - name: upload tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-windows
          path: tmp/logs/
          if-no-files-found: warn

  # THE MATRIX lives in matrix.yml, so the release can run the same matrix
  # against the driver its installer installs (#39). Here it runs against a
  # development build of this commit.
  matrix:
    name: matrix
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/matrix.yml

  # THE ONE REQUIRED CHECK. Branch protection names this job instead of each
  # job above, so a job can be added, renamed or split without leaving a
  # required check that never reports. It accepts a skipped job only when
  # the change was documentation alone.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, matrix-schema, portable, windows, matrix]
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        env:
          NEEDS: ${{ toJSON(needs) }}
          # false only for a change to documentation alone: then, and only
          # then, a skipped job is not a failed one.
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "code changed: $CODE"
          bad="$(echo "$NEEDS" | jq -r --arg code "$CODE" '[to_entries[] | select(.value.result != "success" and ($code != "false" or .value.result != "skipped")) | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not 'success': $bad -- failure, cancellation and skipping all mean the gate did not run to completion"
            exit 1
          fi
