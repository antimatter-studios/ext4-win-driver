# CI — what this repo did not have.
#
# Until now the only workflow here was release.yml, on tag push. So the
# WinFSP half of the driver — `mod winfsp_adapter` in mount.rs, 1034 of
# its 1786 lines, gated on `all(windows, feature = "mount")` — was only
# ever compiled when someone cut a release.
#
# That is how this repo drifted onto am-fs-core v0.1.0 while the family
# was on v0.2.4, and onto two floating `heads/main` refs, without
# anything reporting it. A dependency bump could not be validated
# without tagging a release, so it was not validated.
#
# This job is deliberately NOT release.yml with the uploads removed. It
# reuses the same Rust / LLVM-MinGW / libclang / WinFsp setup, because
# that is what makes the Windows half compile at all, and stops there:
# no WiX, no MSI, no installer, no silent-install verification. Those
# are release concerns and they are slow. What this answers is the one
# question a pull request needs answered — does the driver still build
# against its dependencies.
name: CI

on:
  push:
    branches: [main]
  # EVERY pull request, not only those targeting main. With
  # `branches: [main]` a PR stacked on another branch got no run at all,
  # and a PR with no checks has no failing checks.
  pull_request:
  # The full Windows matrix also runs weekly against main, so a change in
  # the runner image, WinFsp or the pinned siblings shows up without a
  # pull request to provoke it, and on demand.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A newer push to a pull request cancels its older run: the matrix job holds
# a Windows runner for most of an hour, and a superseded run's answer is
# about a commit nobody will merge. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The portable half: everything outside `mod winfsp_adapter`. Cheap,
  # fast, and catches most dependency drift before the expensive job
  # even starts.
  portable:
    name: check (${{ matrix.os }}, no Windows features)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        # No submodules: there are none left. winfsp-rs is needed on
        # THIS runner too despite being Windows-only -- cargo resolves
        # every path dependency when it parses the manifest, including
        # cfg(windows) ones this target will never build.

      - name: check out sibling repos
        # The family repos are siblings, not submodules; the refs live
        # in chores.yml so this reads them from there rather than
        # restating them. chore itself is fetched at a pinned version —
        # an unpinned installer would make this workflow depend on
        # whatever chore shipped that morning, which is the opposite of
        # what pinning the siblings is for.
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.9.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.9.0-linux-arm64.tar.gz" ;;
            Darwin-arm64)   asset="chore-0.9.0-darwin-arm64.tar.gz" ;;
            Darwin-x86_64)  asset="chore-0.9.0-darwin-x86_64.tar.gz" ;;
            *) echo "no chore build for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/antimatter-studios/chore/releases/download/v0.9.0/$asset" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The family's scripts run from rust-fs-core (scripts/core.sh), and
      # this repository keeps no copy of them.
      - run: scripts/core.sh family-check

      # EACH STEP IS A QUIET TIER: scripts/tier.sh writes the whole run to
      # tmp/logs/<tier>.log, prints one verdict line, and fails a passing
      # run that printed more than its measured budget (exit 65). The logs
      # are uploaded below, pass or fail.
      - run: scripts/tier.sh check -- cargo check --locked --no-default-features
      - run: scripts/tier.sh clippy -- cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: scripts/tier.sh test -- cargo test --locked --no-default-features

      - name: upload tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-${{ matrix.os }}
          path: tmp/logs/
          if-no-files-found: warn

  # The half that only exists on Windows, and the reason this file is
  # worth its runtime.
  windows:
    name: check (windows, mount + service)
    runs-on: windows-latest
    env:
      LLVM_MINGW_VER: 20260421
    steps:
      - uses: actions/checkout@v4
        # No submodules; winfsp-rs is a sibling like everything
        # else, and the header patch below reaches into that checkout.

      - name: siblings + Windows toolchain (Rust gnullvm, LLVM-MinGW, libclang, WinFsp, fsctl.h patch)
        uses: ./.github/actions/windows-toolchain
        with:
          llvm-mingw-version: ${{ env.LLVM_MINGW_VER }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --features mount,service
        shell: bash
        run: scripts/tier.sh check-windows -- cargo check --locked --features mount,service --target x86_64-pc-windows-gnullvm

      - name: upload tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-windows
          path: tmp/logs/
          if-no-files-found: warn

  # THE MATRIX: test-matrix.json, run by fs-windows-test-harness against a
  # real WinFsp mount. Until this job it ran only on a developer's Mac with
  # a Windows VM, so CI never exercised the driver at all.
  #
  # The images come first, from Linux. Every scenario's image is built by
  # rust-fs-ext4's test-disks/_vm-builder.sh (mkfs.ext4, then a loop mount
  # to populate it -- xattrs, ACLs, symlinks, a GPT whole disk). On a Mac
  # that runs in an Alpine VM; a Windows runner cannot start one, so the
  # same script runs here, as root on ubuntu-latest, once per image type
  # the matrix names. scripts/build-ext4-image.sh hands each scenario its
  # own copy.
  matrix-images:
    name: ext4 images for the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: rust-fs-ext4 at its pin (the image builder lives there)
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }
          git clone --quiet --depth 1 --branch "$(pin FS_EXT4_REF)" "$(pin FS_EXT4_URL)" ../rust-fs-ext4
      - name: install the builder's tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs attr acl fdisk >/dev/null
      - name: build one image per type test-matrix.json names
        run: |
          set -euo pipefail
          types=$(python3 -c 'import json; print(" ".join(sorted({s["image_type"] for s in json.load(open("test-matrix.json"))["scenarios"].values() if isinstance(s, dict) and s.get("image_type")})))')
          echo "image types: $types"
          mkdir -p tmp/logs
          for t in $types; do
            sudo sh ../rust-fs-ext4/test-disks/_vm-builder.sh "$PWD/ext4-images/$t" "$t" >> tmp/logs/matrix-images.log 2>&1 \
              || { echo "building '$t' failed; see tmp/logs/matrix-images.log"; cat tmp/logs/matrix-images.log; exit 1; }
          done
          sudo chown -R "$(id -u):$(id -g)" ext4-images
          ls -l ext4-images/*/
      - uses: actions/upload-artifact@v4
        with:
          name: ext4-matrix-images
          path: ext4-images/
          if-no-files-found: error
          retention-days: 3

  # The runner is its own "Windows VM": sshd on localhost, key auth,
  # PowerShell as the default shell -- the shape rust-fs-ntfs's Windows jobs
  # and the harness's own smoke job use. The driver is built in place and
  # the run is --no-ship, so {vm.workdir} is this checkout and
  # {vm.harness_root} is the ../fs-windows-test-harness sibling: there is
  # nothing to copy to a VM that is the same machine.
  matrix:
    name: matrix (windows, WinFsp, test-matrix.json)
    runs-on: windows-latest
    needs: [matrix-images]
    timeout-minutes: 75
    env:
      LLVM_MINGW_VER: 20260421
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: siblings + Windows toolchain (Rust gnullvm, LLVM-MinGW, libclang, WinFsp, fsctl.h patch)
        uses: ./.github/actions/windows-toolchain
        with:
          llvm-mingw-version: ${{ env.LLVM_MINGW_VER }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ../fs-windows-test-harness/runner/target
          key: windows-matrix-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: make this runner its own Windows VM (sshd, key auth, PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Key generated with Git's ssh-keygen: pwsh would hand
          # `-N '""'` over as a literal two-character passphrase.
          & "$env:ProgramFiles\Git\bin\bash.exe" -c 'mkdir -p ~/.ssh && ssh-keygen -t ed25519 -N "" -f ~/.ssh/ext4-matrix -q'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # runneradmin is an administrator, and sshd_config sends
          # administrators to this file, which must be admin/SYSTEM-only.
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Get-Content "$env:USERPROFILE\.ssh\ext4-matrix.pub" | Set-Content -Encoding ascii $keys
          icacls $keys /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell `
            -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -PropertyType String -Force | Out-Null
          Restart-Service sshd

      - name: build the driver (mount) where the ops look for it
        run: |
          set -euo pipefail
          scripts/tier.sh build-windows -- cargo build --release --locked --features mount --target x86_64-pc-windows-gnullvm
          # fs-windows-test-harness.toml's ops run
          # {vm.workdir}/target/release/ext4.exe, and the host verifiers
          # target/release/ext4 -- the layout a native build has.
          mkdir -p target/release
          cp target/x86_64-pc-windows-gnullvm/release/ext4.exe target/release/ext4.exe

      - name: build the harness runner
        # Before the matrix, so the matrix log holds the matrix and not a
        # cold compile of the runner. --quiet prints nothing on success.
        run: cargo build --quiet --manifest-path ../fs-windows-test-harness/runner/Cargo.toml --release --bin run-matrix

      - uses: actions/download-artifact@v4
        with:
          name: ext4-matrix-images
          path: ext4-images

      - name: the matrix, quietly, under its budget
        env:
          EXT4_PREBUILT_IMAGES: ${{ github.workspace }}/ext4-images
        run: |
          set -euo pipefail
          export EXT4_PREBUILT_IMAGES="$(cygpath -u "$EXT4_PREBUILT_IMAGES")"
          scripts/tier.sh matrix -- bash scripts/run-matrix.sh \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/ext4-matrix)" \
            --vm-workdir="$(cygpath -m "$PWD")" \
            --no-ship

      - name: every scenario with a recipe executed
        # 35 of test-matrix.json's 37 scenarios have a recipe; the other
        # two are markers for test infrastructure that does not exist yet
        # (event injection, an MSI runner), which the runner reports as
        # ignored and tier.sh counts. A run that dispatched less than 35
        # cannot pass, whatever its exit status.
        run: scripts/core.sh test-floor matrix 35

      - name: upload matrix logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-logs-and-diagnostics
          path: |
            tmp/logs/
            test-diagnostics/
          if-no-files-found: warn
